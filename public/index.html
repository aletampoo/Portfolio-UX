{c:"#6b8299",m:99,y:2025,art:"ds",thc:"ds",ty:["Design system","Design system"],
it:{t:"Audi Design System",cl:"Audi · Italdesign",tag:"Un linguaggio condiviso per le interfacce di bordo",role:"Product Designer, in un team di 3",dur:"1 anno",tools:"Figma",
ds:"370 componenti e 1.000 variabili che tengono insieme le interfacce di bordo di più linee di veicoli. Oggi la libreria è usata da 111 team.",
sec:[
{h:"Il contesto",p:"Audi sviluppa interfacce di bordo per linee di veicoli diverse: sportive, SUV, citycar. Ogni linea ha un carattere visivo suo, ma le stesse funzioni di base: accesso al profilo, cruscotto, impostazioni, clima. Per un anno sono stato in un team di tre designer a costruire l’AU Design System, la base condivisa sotto tutte queste interfacce."},
{h:"Il mio ruolo",p:"Nel team di tre designer mi sono occupato di quattro cose.",li:["<b>Costruzione della libreria.</b> Ho disegnato gran parte dei componenti del sistema.","<b>Architettura delle variabili.</b> Ho creato le variabili e le ho applicate ai componenti, togliendo i valori scritti a mano.","<b>Formazione dei designer.</b> Ho insegnato ai team come inserire il kit nel loro processo.","<b>Manutenzione e rilasci.</b> Ho seguito il sistema dopo il lancio, con l’uscita dei nuovi componenti e la cura di quelli esistenti."]},
{h:"Ogni linea ridisegnava le stesse cose",p:"Senza una base comune ogni team ricostruiva da capo gli stessi elementi: un pulsante, una lista, un campo di ricerca. Il costo non si fermava al tempo perso a ridisegnare. A valle gli sviluppatori implementavano tre volte lo stesso componente con tre comportamenti leggermente diversi, e ogni incoerenza tra una vettura e l’altra arrivava fino a chi guida. Il primo lavoro quindi non è stato disegnare, ma fare l’inventario di cosa esisteva già e di quanto si sovrapponeva."},
{h:"I vincoli dell’automotive",p:"Un sistema di design per l’auto non è un sistema per il web. Quattro vincoli hanno guidato ogni scelta.",li:["<b>Lo schermo non è uno solo.</b> Dimensione, proporzione e posizione cambiano da una vettura all’altra.","<b>Chi guarda sta guidando.</b> Ogni stato deve leggersi in un colpo d’occhio, perché compete con la strada.","<b>Il ciclo di vita è lungo.</b> Una scelta sbagliata su un token resta a bordo per anni, non fino al prossimo rilascio.","<b>L’identità non è una sola.</b> Ogni linea deve sembrare sé stessa pur usando gli stessi componenti."]},
{h:"Le tre decisioni su cui regge il sistema",li:["<b>Il tema è una modalità, non una libreria.</b> Ogni linea poteva avere la sua libreria: avremmo avuto tre sistemi da mantenere invece di uno. Il tema è diventato un cambio di modalità sulle variabili, così una linea nuova non si costruisce, si configura.","<b>I token prendono il nome dal ruolo, non dal colore.</b> Un nome descrittivo costringe a rinominare tutto quando il valore cambia; un nome legato alla funzione sopravvive al cambio di colore.","<b>Gli stati sono obbligatori, non opzionali.</b> Idle, Pressed, Active e Disabled fanno parte di ogni componente interattivo: in auto un pulsante che non mostra di essere stato premuto viene premuto di nuovo, e toglie lo sguardo dalla strada."]},
{h:"Come è fatto",p:"Il sistema si legge su tre livelli: le variabili definiscono i valori, i componenti li usano, le schermate li compongono. Tipografia, spaziature e raggi sono legati a variabili, quindi non c’è un solo valore scritto a mano, e cambiare una variabile aggiorna ogni componente che la usa, in tutti i temi.",vis:"sys",st:[["370","componenti"],["1.000","variabili"],["48","stili"]]},
{h:"L’adozione, la parte difficile",p:"Un sistema che nessuno adotta è una libreria morta, e il lavoro vero non è costruire i componenti ma renderli la strada più semplice da percorrere. Oggi i componenti sono in produzione su vetture in commercio.",li:["<b>Formazione diretta dei team.</b> Un sistema si adotta quando chi lo usa sa dove cercare, non quando è completo: ho lavorato con i designer dentro il loro processo, non accanto.","<b>Documentazione con dos e don’ts</b> per ogni componente, così l’uso corretto non dipende da chi te l’ha spiegato a voce.","<b>Naming semantico e API prevedibili,</b> perché chi sviluppa non debba indovinare cosa fa una proprietà.","<b>Manutenzione continua.</b> Nuovi componenti, correzioni, rilasci: il sistema è un prodotto, non una consegna."],st:[["111","team usano la libreria"],["10.400","inserimenti in una settimana"]]},
{h:"Cosa rifarei diversamente",p:"I numeri di adozione nascondono una cosa: l’uso è molto concentrato. Due soli programmi generano l’87% degli inserimenti, mentre diversi team restano sotto l’1%. Un sistema usato da 111 team sembra adottato, ma è la coda lunga a dire dove il lavoro non è finito. Oggi partirei da lì: affiancherei prima i team a bassa adozione per capire cosa li blocca, invece di leggere il numero complessivo come un risultato raggiunto."}]},
 en:{t:"Audi Design System",cl:"Audi · Italdesign",tag:"A shared language for in-car interfaces",role:"Product Designer, one of three",dur:"1 year",tools:"Figma",
ds:"370 components and 1,000 variables holding together the in-car interfaces of several vehicle lines. The library is used by 111 teams today.",
sec:[
{h:"Context",p:"Audi builds in-car interfaces for different vehicle lines: sports cars, SUVs, city cars. Each line has its own visual character but the same core functions: profile access, dashboard, settings, climate. For a year I was part of a team of three designers building the AU Design System, the shared foundation under all of those interfaces."},
{h:"My role",p:"In the team of three designers I owned four things.",li:["<b>Building the library.</b> I designed most of the components in the system.","<b>Variable architecture.</b> I created the variables and applied them across the components, removing hand-written values.","<b>Training the designers.</b> I taught the teams how to fit the kit into their own process.","<b>Maintenance and releases.</b> I looked after the system after launch, shipping new components and keeping the existing ones healthy."]},
{h:"Every line was redrawing the same things",p:"Without a common foundation each team rebuilt the same elements from scratch: a button, a list, a search field. The cost didn’t stop at the time lost redrawing. Downstream, engineers implemented the same component three times with three slightly different behaviours, and every inconsistency between one car and the next reached the person driving. So the first job wasn’t to design: it was to inventory what already existed and how much of it overlapped."},
{h:"The constraints of automotive",p:"A design system for a car is not a design system for the web. Four constraints shaped every decision.",li:["<b>There is no single screen.</b> Size, proportion and position change from one vehicle to the next.","<b>The person looking is driving.</b> Every state has to read at a glance, because it competes with the road.","<b>The lifecycle is long.</b> A bad decision on a token stays in the car for years, not until the next release.","<b>There is no single identity.</b> Each line has to look like itself while using the same components."]},
{h:"The three decisions the system rests on",li:["<b>A theme is a mode, not a library.</b> Each line could have had its own library: we would have had three systems to maintain instead of one. The theme became a mode switch on the variables, so a new line isn’t built, it’s configured.","<b>Tokens are named after their role, not their colour.</b> A descriptive name forces you to rename everything when the value changes; a name tied to function survives a colour change.","<b>States are mandatory, not optional.</b> Idle, Pressed, Active and Disabled are part of every interactive component: in a car, a button that doesn’t show it was pressed gets pressed again, and takes eyes off the road."]},
{h:"How it’s built",p:"The system reads in three layers: variables define the values, components use them, screens compose them. Typography, spacing and radii are bound to variables, so there isn’t a single hand-written value, and changing one variable updates every component that uses it, across all themes.",vis:"sys",st:[["370","components"],["1,000","variables"],["48","styles"]]},
{h:"Adoption, the hard part",p:"A system nobody adopts is a dead library, and the real work isn’t building the components but making them the easiest path to take. The components are in production in cars on the market today.",li:["<b>Training the teams directly.</b> A system gets adopted when the people using it know where to look, not when it is complete: I worked with the designers inside their process, not next to it.","<b>Documentation with dos and don’ts</b> for every component, so correct use doesn’t depend on who explained it to you.","<b>Semantic naming and predictable APIs,</b> so engineers don’t have to guess what a property does.","<b>Continuous maintenance.</b> New components, fixes, releases: the system is a product, not a delivery."],st:[["111","teams use the library"],["10,400","insertions in one week"]]},
{h:"What I’d do differently",p:"The adoption numbers hide something: usage is heavily concentrated. Two programmes alone generate 87% of all insertions, while several teams stay below 1%. A system used by 111 teams looks adopted, but it is the long tail that says where the work isn’t finished. Today I’d start there: sit with the low-adoption teams first to find out what blocks them, instead of reading the headline number as a result achieved."}]}},
