<style>

.v3 i:nth-child(3){left:53%;top:23%;width:16%;height:54%}
.v3 i:nth-child(4){left:76%;top:41%;width:9%;height:17%;border-radius:50%}

.pbig{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);width:clamp(84px,15cqw,152px);aspect-ratio:1;border:0;padding:0;border-radius:50%;background:#ffffff1c;backdrop-filter:blur(10px);display:grid;place-items:center;box-shadow:0 0 0 1px #ffffff40,0 12px 42px #0009,0 0 60px color-mix(in srgb,var(--pc,#fff) 35%,transparent);transition:transform .28s cubic-bezier(.3,1.4,.5,1),background .28s,box-shadow .28s}

{r:"Senior Product Designer",c:"ALTEN",t:"Full-time",d:"Nov 2023 – Present",l:"Turin, Italy · Hybrid",b:["I lead the architecture and evolution of the design system behind a leading EU automotive brand: 370 components and 1,000 tokens, used by 111 teams today. I migrated the whole system from HTML to Figma and wired it to the code through Tokens Studio and GitHub.","I design the experience of infotainment and HMI systems, owning features from definition to release and keeping behaviour coherent across the car’s domains.","I bring research into product decisions: journey mapping and in-car prototype testing with users, with findings that reach management as choices rather than reports.","I train designers to work with the system and own its releases: documentation, new components and continuous maintenance.","I work side by side with engineers, developers, product managers and stakeholders from other departments through the whole production cycle, turning technical constraints into interface decisions."]},
{r:"Product Designer",c:"Tata Consultancy Services",t:"Full-time",d:"Sep 2022 – Nov 2023",l:"London, United Kingdom · Hybrid",b:["I led the end-to-end design of a new MVP for a leading UK bank: 40+ screens and the design system holding them together, from research to user testing.","I led benchmarking and competitive analysis for a top-three UK bank, and presented journeys, pain points and customer mental models to 50+ stakeholders.","I lifted the usability of a leading EU rail company’s web app by 20%, combining heuristic evaluation, mixed-method research, eye-tracking and A/B testing."]},
{r:"Product Designer",c:"Auto Gest S.R.L",t:"Contract",d:"Jan 2022 – Jun 2022",l:"Europe · Remote",b:["I facilitated the workshops and built the user journeys for internal tools and dashboards, surfacing friction and opportunities the teams could not see.","I redesigned the CRM tools around a user-centred approach: errors down 15% and engagement up 10%.","I reworked the flows on research and analytics, cutting errors by 30% and aligning outcomes with SCRUM teams and stakeholders."]},
{r:"Product Designer",c:"TESYouth",t:"Contract",d:"May 2020 – Apr 2021",l:"London, United Kingdom · Remote",b:["I turned market data and competitive analysis into actionable direction for strategy and product development.","I designed and ran surveys and data collection, going beyond what the client expected.","I made the data readable for decision-makers, with reports that improved product alignment."]}],ctT:"Shall we work together?",ctS:"Tell me about your project: I reply within 24 hours.",mail:"Copy my email",copied:"Email copied:",foot:"End credits. Thanks for watching."}};

it:{t:"Automotive Design System",cl:"Il cliente · Alten",tag:"Un linguaggio condiviso per le interfacce di bordo",role:"Product Designer",team:"3 designer",dur:"1 anno",tools:"Figma",
ds:"370 componenti e 1.000 token che tengono insieme le interfacce di bordo di più linee di veicoli. Oggi la libreria è usata da 111 team.",
sm:"Per un anno ho costruito, con altri due designer, il design system delle interfacce di bordo del cliente: 370 componenti e 1.000 token. Oggi è usato da 111 team ed è in produzione su vetture in commercio.",
sec:[
{n:"01",h:"La sfida",p:["Il cliente è un costruttore automobilistico e sviluppa interfacce di bordo per linee di veicoli diverse: sportive, SUV, citycar. Ogni linea ha un carattere visivo suo, ma le stesse funzioni di base: accesso al profilo, cruscotto, impostazioni, clima.","Un sistema in realtà esisteva già, ma viveva nel codice: una libreria HTML, consultabile da chi sviluppa e inutilizzabile da chi disegna. I designer la guardavano e la ridisegnavano a mano ogni volta, e a ogni iterazione il design si allontanava da quello che era davvero implementato.","Senza una base che i designer potessero usare davvero, ogni team ricostruiva da capo gli stessi elementi: un pulsante, una lista, un campo di ricerca. Il costo non si fermava al tempo perso a ridisegnare. A valle gli sviluppatori implementavano tre volte lo stesso componente con tre comportamenti leggermente diversi, e ogni incoerenza tra una vettura e l’altra arrivava fino a chi guida. Il primo lavoro quindi non è stato disegnare, ma fare l’inventario di cosa esisteva già e di quanto si sovrapponeva.","A rendere il problema diverso da un sistema per il web sono stati quattro vincoli."],li:["<b>Lo schermo non è uno solo.</b> Dimensione, proporzione e posizione cambiano da una vettura all’altra.","<b>Chi guarda sta guidando.</b> Ogni stato deve leggersi in un colpo d’occhio, perché compete con la strada.","<b>Il ciclo di vita è lungo.</b> Una scelta sbagliata su un token resta a bordo per anni, non fino al prossimo rilascio.","<b>L’identità non è una sola.</b> Ogni linea deve sembrare sé stessa pur usando gli stessi componenti."]},
{n:"02",h:"Il mio ruolo",p:"Per un anno sono stato in un team di tre designer. Mi sono occupato di cinque cose.",li:["<b>Costruzione della libreria.</b> Ho disegnato gran parte dei componenti del sistema.","<b>Architettura dei token.</b> Ho creato i token e li ho applicati ai componenti, togliendo i valori scritti a mano.","<b>Formazione dei designer.</b> Ho insegnato ai team come inserire il kit nel loro processo.","<b>Manutenzione e rilasci.</b> Ho seguito il sistema dopo il lancio, con l’uscita dei nuovi componenti e la cura di quelli esistenti.","<b>Validazione sul campo.</b> Ho testato i prototipi in auto con gli utenti, per verificare che quello che funziona a schermo funzioni anche alla guida."]},
{n:"03",h:"Il processo",p:"Tre decisioni di architettura hanno definito il sistema. Ognuna aveva un’alternativa più veloce da costruire e molto più costosa da mantenere.",stp:[{t:"Migrazione",s:"dal codice allo strumento di chi disegna",p:"Portare il sistema da HTML a Figma non è stato un travaso. Ogni elemento andava ricostruito come componente, con le sue proprietà e i suoi stati, e rimesso in discussione: è stata l’occasione per togliere quello che nessuno usava invece di trasferirlo."},{t:"Temi",s:"una modalità, non una libreria",p:"Ogni linea poteva avere la sua libreria: avremmo avuto tre sistemi da mantenere invece di uno. Il tema è diventato un cambio di modalità sui token, così una linea nuova non si costruisce, si configura."},{t:"Token",s:"il nome viene dal ruolo, non dal colore",p:"Un nome descrittivo costringe a rinominare tutto quando il valore cambia; un nome legato alla funzione sopravvive al cambio di colore. È la differenza tra un sistema che si aggiorna e uno che si rifà."},{t:"Stati",s:"obbligatori, non opzionali",p:"Idle, Pressed, Active e Disabled fanno parte di ogni componente interattivo. In auto un pulsante che non mostra di essere stato premuto viene premuto di nuovo, e toglie lo sguardo dalla strada."},{t:"Pipeline",s:"un solo posto dove cambia un valore",p:"I token non si fermano in Figma: passano da Tokens Studio e arrivano al codice attraverso GitHub. Design e sviluppo leggono la stessa fonte, quindi un colore o una spaziatura si cambia in un punto solo e arriva ovunque, senza che nessuno debba ricopiarlo a mano."}]},
{n:"04",h:"Il lavoro in sintesi",p:"Il sistema si legge su tre livelli: i token definiscono i valori, i componenti li usano, le schermate li compongono. Tipografia, spaziature e raggi sono legati a token, quindi non c’è un solo valore scritto a mano, e cambiare un token aggiorna ogni componente che lo usa, in tutti i temi.",vis:"sys",st:[["370","componenti"],["1.000","token"],["48","stili"]]},
{n:"05",h:"Il risultato",p:"Un sistema che nessuno adotta è una libreria morta, e il lavoro vero non è costruire i componenti ma renderli la strada più semplice da percorrere. Oggi i componenti sono in produzione su vetture in commercio.",li:["<b>Formazione diretta dei team.</b> Un sistema si adotta quando chi lo usa sa dove cercare, non quando è completo: ho lavorato con i designer dentro il loro processo, non accanto.","<b>Documentazione con dos e don’ts</b> per ogni componente, così l’uso corretto non dipende da chi te l’ha spiegato a voce.","<b>Naming semantico e API prevedibili,</b> perché chi sviluppa non debba indovinare cosa fa una proprietà.","<b>Manutenzione continua.</b> Nuovi componenti, correzioni, rilasci: il sistema è un prodotto, non una consegna."],st:[["111","team usano la libreria"],["10.400","inserimenti in una settimana"]]},
{n:"06",h:"Cosa resta",p:"I numeri di adozione nascondono una cosa: l’uso è molto concentrato. Due soli programmi generano l’87% degli inserimenti, mentre diversi team restano sotto l’1%. Un sistema usato da 111 team sembra adottato, ma è la coda lunga a dire dove il lavoro non è finito. Oggi partirei da lì: affiancherei prima i team a bassa adozione per capire cosa li blocca, invece di leggere il numero complessivo come un risultato raggiunto."}]},
 en:{t:"Automotive Design System",cl:"The client · Alten",tag:"A shared language for in-car interfaces",role:"Product Designer",team:"3 designers",dur:"1 year",tools:"Figma",
ds:"370 components and 1,000 tokens holding together the in-car interfaces of several vehicle lines. The library is used by 111 teams today.",
sm:"For a year I built, with two other designers, the design system behind the client’s in-car interfaces: 370 components and 1,000 tokens. It is used by 111 teams today and is in production in cars on the market.",
sec:[
{n:"01",h:"The challenge",p:["The client is a car manufacturer and builds in-car interfaces for different vehicle lines: sports cars, SUVs, city cars. Each line has its own visual character but the same core functions: profile access, dashboard, settings, climate.","A system did exist, but it lived in the code: an HTML library, readable by engineers and unusable by designers. Designers looked at it and redrew it by hand every time, and with each iteration the design drifted further from what was actually implemented.","Without a foundation designers could actually use, each team rebuilt the same elements from scratch: a button, a list, a search field. The cost didn’t stop at the time lost redrawing. Downstream, engineers implemented the same component three times with three slightly different behaviours, and every inconsistency between one car and the next reached the person driving. So the first job wasn’t to design: it was to inventory what already existed and how much of it overlapped.","What made this different from a system for the web were four constraints."],li:["<b>There is no single screen.</b> Size, proportion and position change from one vehicle to the next.","<b>The person looking is driving.</b> Every state has to read at a glance, because it competes with the road.","<b>The lifecycle is long.</b> A bad decision on a token stays in the car for years, not until the next release.","<b>There is no single identity.</b> Each line has to look like itself while using the same components."]},
{n:"02",h:"My role",p:"For a year I was part of a team of three designers. I owned five things.",li:["<b>Building the library.</b> I designed most of the components in the system.","<b>Token architecture.</b> I created the tokens and applied them across the components, removing hand-written values.","<b>Training the designers.</b> I taught the teams how to fit the kit into their own process.","<b>Maintenance and releases.</b> I looked after the system after launch, shipping new components and keeping the existing ones healthy.","<b>Validation in context.</b> I tested prototypes in the car with users, to check that what worked on screen also worked while driving."]},
{n:"03",h:"The process",p:"Three architectural decisions defined the system. Each had an alternative that was faster to build and far more expensive to maintain.",stp:[{t:"Migration",s:"from code to the tool designers work in",p:"Moving the system from HTML to Figma was not a transfer. Every element had to be rebuilt as a component, with its properties and states, and questioned on the way: it was the chance to drop what nobody used instead of carrying it over."},{t:"Themes",s:"a mode, not a library",p:"Each line could have had its own library: we would have had three systems to maintain instead of one. The theme became a mode switch on the tokens, so a new line isn’t built, it’s configured."},{t:"Tokens",s:"named after the role, not the colour",p:"A descriptive name forces you to rename everything when the value changes; a name tied to function survives a colour change. It is the difference between a system that updates and one that gets rebuilt."},{t:"States",s:"mandatory, not optional",p:"Idle, Pressed, Active and Disabled are part of every interactive component. In a car, a button that doesn’t show it was pressed gets pressed again, and takes eyes off the road."},{t:"Pipeline",s:"one place where a value changes",p:"The tokens don’t stop in Figma: they run through Tokens Studio and reach the code via GitHub. Design and engineering read the same source, so a colour or a spacing value changes in one place and lands everywhere, with nobody copying it by hand."}]},
{n:"04",h:"The work in summary",p:"The system reads in three layers: tokens define the values, components use them, screens compose them. Typography, spacing and radii are bound to tokens, so there isn’t a single hand-written value, and changing one token updates every component that uses it, across all themes.",vis:"sys",st:[["370","components"],["1,000","tokens"],["48","styles"]]},
{n:"05",h:"The result",p:"A system nobody adopts is a dead library, and the real work isn’t building the components but making them the easiest path to take. The components are in production in cars on the market today.",li:["<b>Training the teams directly.</b> A system gets adopted when the people using it know where to look, not when it is complete: I worked with the designers inside their process, not next to it.","<b>Documentation with dos and don’ts</b> for every component, so correct use doesn’t depend on who explained it to you.","<b>Semantic naming and predictable APIs,</b> so engineers don’t have to guess what a property does.","<b>Continuous maintenance.</b> New components, fixes, releases: the system is a product, not a delivery."],st:[["111","teams use the library"],["10,400","insertions in one week"]]},
{n:"06",h:"What remains",p:"The adoption numbers hide something: usage is heavily concentrated. Two programmes alone generate 87% of all insertions, while several teams stay below 1%. A system used by 111 teams looks adopted, but it is the long tail that says where the work isn’t finished. Today I’d start there: sit with the low-adoption teams first to find out what blocks them, instead of reading the headline number as a result achieved."}]}},
