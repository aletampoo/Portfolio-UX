/* ===== Linguaggio olografico del sito ===== */
.hro{opacity:0}

/* pannelli olografici */
.abp,.skg,.res>div,.sl li,.mta>div{position:relative;background:linear-gradient(160deg,color-mix(in srgb,var(--hc) 11%,#0000),color-mix(in srgb,var(--hc) 3%,#0000));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--hc) 28%,transparent),0 0 30px color-mix(in srgb,var(--hc) 7%,transparent);border:0;border-radius:14px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

.abp::before,.skg::before,.res>div::before,.sl li::before,.mta>div::before{left:-1px;top:-1px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.abp::after,.skg::after,.res>div::after,.sl li::after,.mta>div::after{right:-1px;bottom:-1px;border-left:0;border-top:0;border-radius:0 0 14px 0}
.abp:hover::before,.abp:hover::after,.skg:hover::before,.skg:hover::after,.res>div:hover::before,.res>div:hover::after,.sl li:hover::before,.sl li:hover::after{width:30px;height:30px;opacity:1}

.chips2 span:hover{background:color-mix(in srgb,var(--hc) 22%,#0000);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--hc) 80%,transparent),0 0 18px color-mix(in srgb,var(--hc) 30%,transparent);color:#fff;text-shadow:0 0 10px var(--hc)}

it:{t:"Automotive Design System",cl:"Alten",tags:["Automotive","HMI","Design system"],tag:"Un linguaggio condiviso per le interfacce di bordo",role:"Product Designer",team:"3 designer",dur:"1 anno",tools:"Figma, Tokens Studio",

sm:"In un team di tre designer ho costruito per un anno il design system delle interfacce di bordo del cliente: 370 componenti e 1.000 token, usato da 111 team e in produzione su vetture in commercio.",
tl:[["Problema","Il sistema esisteva solo nel codice. I designer lo ridisegnavano a mano e ogni team ricostruiva gli stessi componenti."],["Soluzione","Un design system in Figma basato sui token, con un tema per ogni linea di veicoli e collegato direttamente al codice."],["Risultato","370 componenti e 1.000 token, usati da 111 team. In produzione su vetture in commercio."]],
sec:[
{n:"01",h:"La sfida",p:["Il cliente sviluppa interfacce di bordo per più linee di veicoli, con le stesse funzioni di base. Il sistema esistente era una libreria HTML: utile a chi sviluppa, inutilizzabile da chi disegna. Risultato: componenti ridisegnati a mano, implementati più volte, incoerenti da un’auto all’altra.","Quattro vincoli lo rendevano diverso da un sistema per il web:"],li:["<b>Schermi diversi</b>Dimensioni e proporzioni cambiano da vettura a vettura.","<b>Chi guarda sta guidando</b>Ogni stato si deve capire in un colpo d’occhio.","<b>Ciclo di vita lungo</b>Un token sbagliato resta a bordo per anni.","<b>Più identità</b>Ogni linea ha il suo stile, con gli stessi componenti."]},
{n:"02",h:"Il mio ruolo",p:"Uno di tre designer, per un anno.",li:["<b>Libreria</b>Ho disegnato gran parte dei componenti.","<b>Token</b>Li ho creati e applicati, eliminando i valori scritti a mano.","<b>Formazione</b>Ho insegnato ai team a usare il kit nel loro processo.","<b>Manutenzione</b>Nuovi componenti e rilasci dopo il lancio.","<b>Test in auto</b>Ho provato i prototipi alla guida con gli utenti."]},
{n:"03",h:"Le scelte chiave",p:"Cinque decisioni, prese per un sistema facile da mantenere, non solo veloce da costruire.",stp:[{t:"Migrazione",s:"da HTML a Figma",p:"Ogni elemento ricostruito come componente con proprietà e stati. Quello che nessuno usava è stato eliminato."},{t:"Temi",s:"una modalità, non una libreria",p:"Una nuova linea di veicoli si configura cambiando la modalità dei token, non si costruisce da zero."},{t:"Token",s:"nominati per ruolo, non per colore",p:"Il nome legato alla funzione resiste al cambio di valore: niente rinomine a ogni restyling."},{t:"Stati",s:"sempre presenti",p:"Idle, Pressed, Active e Disabled in ogni componente: in auto un tocco senza feedback viene ripetuto e distrae dalla strada."},{t:"Pipeline",s:"un valore, un solo punto",p:"Da Figma al codice con Tokens Studio e GitHub: un colore cambia in un punto e arriva ovunque."}]},
{n:"04",h:"Il sistema",p:"Tre livelli: i token definiscono i valori, i componenti li usano, le schermate li compongono. Cambiare un token aggiorna ogni componente, in tutti i temi.",vis:"sys",st:[["370","componenti"],["1.000","token"],["48","stili"]]},

 en:{t:"Automotive Design System",cl:"Alten",tags:["Automotive","HMI","Design system"],tag:"A shared language for in-car interfaces",role:"Product Designer",team:"3 designers",dur:"1 year",tools:"Figma, Tokens Studio",

sec:[
{n:"01",h:"The challenge",p:["The client builds in-car interfaces for several vehicle lines that share the same core functions. The existing system was an HTML library: useful to engineers, unusable for designers. The result: components redrawn by hand, implemented several times, inconsistent from one car to the next.","Four constraints made it different from a web system:"],li:["<b>Different screens</b>Size and proportions change from car to car.","<b>The viewer is driving</b>Every state has to read at a glance.","<b>Long lifecycle</b>A wrong token stays in the car for years.","<b>Many identities</b>Each line has its own style, with the same components."]},
{n:"02",h:"My role",p:"One of three designers, for a year.",li:["<b>Library</b>I designed most of the components.","<b>Tokens</b>I created and applied them, removing hand-written values.","<b>Training</b>I taught teams to fit the kit into their process.","<b>Maintenance</b>New components and releases after launch.","<b>In-car testing</b>I tested prototypes with users while driving."]},
{n:"03",h:"Key decisions",p:"Five decisions, made for a system that is easy to maintain, not just quick to build.",stp:[{t:"Migration",s:"from HTML to Figma",p:"Every element rebuilt as a component with properties and states. Whatever nobody used was dropped."},{t:"Themes",s:"a mode, not a library",p:"A new vehicle line is configured by switching the token mode, not built from scratch."},{t:"Tokens",s:"named by role, not colour",p:"A name tied to function survives a value change: no renaming at every restyle."},{t:"States",s:"always there",p:"Idle, Pressed, Active and Disabled in every component: in a car, a tap with no feedback gets repeated and pulls eyes off the road."},{t:"Pipeline",s:"one value, one place",p:"From Figma to code through Tokens Studio and GitHub: a colour changes in one place and lands everywhere."}]},
{n:"04",h:"The system",p:"Three layers: tokens define the values, components use them, screens compose them. Changing a token updates every component, in every theme.",vis:"sys",st:[["370","components"],["1,000","tokens"],["48","styles"]]},
{n:"05",h:"The result",shH:"Real screens",shots:[["ds-real-home.jpg","Home: widgets, media and climate controls"],["ds-real-park.jpg","Parking assist with camera view"],["ds-real-list.jpg","List with tabs and selection"]],p:"The components are in production in cars on the market. Adoption came from four choices:",li:["<b>Training inside teams</b>Working within their process, not next to it.","<b>Dos and don’ts</b>Documented for every component.","<b>Semantic naming</b>Predictable APIs for engineers.","<b>Continuous maintenance</b>The system is a product, not a delivery."],st:[["111","teams use the library"],["10,400","insertions in one week"]]},
{n:"06",h:"What I’d do next",p:"Usage is concentrated: two programmes generate 87% of insertions, while several teams stay below 1%. The next step is to sit with the low-adoption teams and find out what blocks them."}]}},

  function ui(){var t=U[L];ov.hidden=st===1;
    if(st===0){$("#gt").textContent=t.gN;$("#gm").textContent=t.gD;$("#gb").textContent=t.gStart}
    else if(st===2){$("#gt").textContent=t.gOver;$("#gm").textContent=dead.a+": “"+dead.ls.join(" ")+"” ("+t.gScore+": "+Math.floor(dist/10)+")";$("#gb").textContent=t.gRetry}
    $("#gbst").textContent=t.gBest+" "+best;lastS=-1}
  window.gUpdate=ui;
  function start(){st=1;y=GR-SZ;vy=0;air=0;ob=[];nx=W*.6;dist=0;sp=SPB;dead=null;shake=0;ui();gf.focus({preventScroll:true})}
  function end(o){st=2;dead=o;shake=.4;deadT=tm;var s=Math.floor(dist/10);if(s>best){best=s;try{localStorage.setItem("at-best",best)}catch(e){}}ui()}
  function jump(){if(st===1&&y>=GR-SZ-1)vy=JV}
  function rr(x,yy,w,h,r){c.beginPath();c.moveTo(x+r,yy);c.arcTo(x+w,yy,x+w,yy+h,r);c.arcTo(x+w,yy+h,x,yy+h,r);c.arcTo(x,yy+h,x,yy,r);c.arcTo(x,yy,x+w,yy,r);c.closePath()}
  function tx(s,x,yy,sz,col,wt,al){c.fillStyle=col;c.font=(wt||700)+" "+sz+"px "+FF;c.textAlign=al||"center";c.textBaseline="middle";c.fillText(s,x,yy)}
  function spawn(){
    var m=MM[L][Math.floor(Math.random()*MM[L].length)],ls,w=0;
    c.font="600 11px "+FF;
    if(POR){
      var mx=W*.22,cl="";ls=[];
      m[1].replace(/\n/g," ").split(" ").forEach(function(q){
        var tt=cl?cl+" "+q:q;
        if(cl&&c.measureText(tt).width>mx){ls.push(cl);cl=q}else cl=tt;
      });
      if(cl)ls.push(cl);
    }else ls=m[1].split("\n");
    ls.forEach(function(l){w=Math.max(w,c.measureText(l).width)});
    ob.push({a:m[0],ls:ls,w:Math.ceil(w)+26,h:30+ls.length*14,x:W+20,col:COL[(m[0].length+ls[0].length)%COL.length]});
  }
  function step(dt){
    tm+=dt;
    var bgv=st===1?sp*.35:(st===2?0:28);bo+=bgv*dt*.5;
    FR.forEach(function(f){f.x-=bgv*dt;if(f.x+f.w<-20){var mx=0;FR.forEach(function(g){mx=Math.max(mx,g.x+g.w)});nf(f,Math.max(W+10,mx+30+Math.random()*50))}});
    CU.forEach(function(u){
      var f=u.f;if(f.x+f.w<10||f.x>W)pick(u);f=u.f;
      var tx_=u.mode==="size"?f.x+f.w:f.x+f.w/2,ty_=u.mode==="size"?f.y+f.h:f.y;
      var k=1-Math.exp(-dt*(u.ph===1?14:3));u.x+=(tx_-u.x)*k;u.y+=(ty_-u.y)*k;u.t+=dt;
      if(u.ph===0&&Math.hypot(tx_-u.x,ty_-u.y)<5){u.ph=1;u.t=0}
      else if(u.ph===1){
        if(u.mode==="size"){f.w=clamp(f.w+u.dir*45*dt,100,170);f.h=clamp(f.h+u.dir*30*dt,60,130)}
        else f.y=clamp(f.y+u.dir*40*dt,20,GR-f.h-50);
        if(u.t>1.4){u.ph=2;u.t=0}
      }else if(u.ph===2&&u.t>.6)pick(u);
    });
    if(st===1){
      sp=SPB+Math.min(SPM,dist/12);dist+=sp*dt;
      vy+=GRV*dt;y+=vy*dt;
      if(y>=GR-SZ){y=GR-SZ;vy=0;air=0}else air+=dt;
      nx-=sp*dt;
      if(nx<=0){spawn();nx=sp*(POR?1.15:.8)+(POR?90:90)+Math.random()*(POR?130:180)}
      ob.forEach(function(o){o.x-=sp*dt});ob=ob.filter(function(o){return o.x+o.w>-20});
      var px=PX+5,py=y+5,pw=SZ-10,ph=SZ-10;
      for(var i=0;i<ob.length;i++){var o=ob[i],ox=o.x+3,oy=GR-o.h+3;if(px<ox+o.w-6&&px+pw>ox&&py<oy+o.h-6&&py+ph>oy){end(o);break}}
    }else if(st===0){y=GR-SZ-Math.abs(Math.sin(tm*3))*10}
    if(shake>0)shake-=dt;
  }
  function drawOb(o){
    var x=o.x,yy=GR-o.h;
    c.save();c.shadowColor="#0009";c.shadowBlur=12;rr(x,yy,o.w,o.h,10);c.fillStyle="#fff";c.fill();c.restore();
    c.fillStyle=o.col;c.beginPath();c.arc(x+14,yy+14,7,0,7);c.fill();
    tx(o.a,x+26,yy+14,10,"#666","left",700);
    o.ls.forEach(function(l,i){tx(l,x+12,yy+31+i*14,11,"#111","left",600)});
  }
  function draw(){
    c.setTransform(sc,0,0,sc,0,0);
    var g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,"#1c1c1c");g.addColorStop(1,"#0b0b0b");c.fillStyle=g;c.fillRect(0,0,W,H);
    c.save();if(shake>0)c.translate((Math.random()-.5)*25*shake,(Math.random()-.5)*25*shake);
    c.fillStyle="#ffffff14";var o1=bo%30;
    for(var i=-1;i<W/30+2;i++)for(var j=0;j<H/30;j++)c.fillRect(i*30-o1,15+j*30,2,2);
    FR.forEach(function(f){c.fillStyle="#ffffff08";c.fillRect(f.x,f.y,f.w,f.h);c.strokeStyle="#ffffff26";c.lineWidth=1.2;c.strokeRect(f.x,f.y,f.w,f.h);tx("Frame "+f.n,f.x,f.y-8,10,"#ffffff55",600,"left")});
    CU.forEach(function(u){
      var f=u.f;c.strokeStyle=u.col;c.lineWidth=1.8;c.strokeRect(f.x,f.y,f.w,f.h);
      [[f.x,f.y],[f.x+f.w,f.y],[f.x,f.y+f.h],[f.x+f.w,f.y+f.h]].forEach(function(q){c.fillStyle="#fff";c.fillRect(q[0]-3,q[1]-3,6,6);c.strokeRect(q[0]-3,q[1]-3,6,6)});
      if(u.ph===1&&u.mode==="size"){var lb=Math.round(f.w)+" × "+Math.round(f.h);rr(f.x+f.w/2-27,f.y+f.h+8,54,15,7);c.fillStyle=u.col;c.fill();tx(lb,f.x+f.w/2,f.y+f.h+15.5,9,"#fff",700)}
    });
    c.fillStyle="#090909";c.fillRect(0,GR,W,H-GR);c.fillStyle="#e50914";c.fillRect(0,GR,W,3);
    c.fillStyle="#ffffff1c";var o3=(dist+bo*2)%60;for(var m=-1;m<W/60+1;m++)c.fillRect(m*60-o3,GR+16,30,3);
    ob.forEach(drawOb);
    c.save();c.translate(PX+SZ/2,y+SZ/2);c.rotate(Math.PI*Math.min(1,air/.8));
    var pg=c.createLinearGradient(-SZ/2,-SZ/2,SZ/2,SZ/2);pg.addColorStop(0,"#1abcfe");pg.addColorStop(1,"#a259ff");
    rr(-SZ/2,-SZ/2,SZ,SZ,8);c.fillStyle=pg;c.fill();c.strokeStyle="#fff";c.lineWidth=2;c.stroke();
    if(st===2){c.strokeStyle="#fff";c.lineWidth=2.5;[-8,8].forEach(function(e){c.beginPath();c.moveTo(e-4,-8);c.lineTo(e+4,0);c.moveTo(e+4,-8);c.lineTo(e-4,0);c.stroke()})}
    else{c.fillStyle="#fff";[-8,8].forEach(function(e){c.beginPath();c.arc(e,-4,5.5,0,7);c.fill()});c.fillStyle="#111";[-8,8].forEach(function(e){c.beginPath();c.arc(e+2,-4,2.4,0,7);c.fill()})}
    c.restore();
    CU.forEach(function(u){
      c.save();c.translate(u.x,u.y);c.fillStyle=u.col;c.strokeStyle="#fff";c.lineWidth=1.5;
      c.beginPath();c.moveTo(0,0);c.lineTo(0,15);c.lineTo(4,11.5);c.lineTo(7.5,19);c.lineTo(10,18);c.lineTo(6.5,10.5);c.lineTo(11.5,10.5);c.closePath();c.fill();c.stroke();
      c.font="700 10px "+FF;var wd=c.measureText(u.n).width+14;rr(11,17,wd,16,8);c.fillStyle=u.col;c.fill();tx(u.n,11+wd/2,25,10,"#fff",700);
      c.restore();
    });
    c.restore();
    if(st===2&&shake>0){c.fillStyle="rgba(229,9,20,"+shake*.5+")";c.fillRect(0,0,W,H)}
  }
  function hud(){var s=Math.floor(dist/10);if(s!==lastS){lastS=s;$("#gs").textContent=U[L].gScore+" "+s}}
  function loop(t){requestAnimationFrame(loop);var dt=Math.min((t-last)/1000||0,.05);last=t;
    if(!vis||document.hidden||document.body.classList.contains("fs")||!cv.clientWidth)return;
    if(!sc)size();step(dt);draw();hud()}
  gf.addEventListener("pointerdown",function(e){if(e.target.closest("#gb"))return;if(st===1)jump()});
  gf.addEventListener("keydown",function(e){
    if(e.code==="Space"||e.key==="ArrowUp"||e.key==="w"){
      if(e.target.closest("#gb"))return;
      e.preventDefault();
      if(st===1)jump();else if(!e.repeat&&(st===0||tm-deadT>.5))start()}});
  $("#gb").addEventListener("click",start);
  new ResizeObserver(size).observe(cv);
  new IntersectionObserver(function(e){vis=e[0].isIntersecting}).observe(cv);
  ui();requestAnimationFrame(loop);
})();

/* ===== Linguaggio olografico: comparsa "materializzata" e numeri che contano ===== */
var HSEL=".sx>h2,.row h2,.rsub,.abp,.lkb,.skg,.ex,.lead,.mta>div,.cs2 h3,.cs2>p,.csk,.cst,.cstags,.csimg,.sl li,.stp article,.tld h3,.tld article,.shots figure,.sysv figure,.mocks,.res>div,.nx",HIO=null;
function hrv(root){
  if(!root||RMO||!("IntersectionObserver" in window))return;
  if(!HIO)HIO=new IntersectionObserver(function(es){var k=0;es.forEach(function(e){if(!e.isIntersecting)return;var el=e.target;HIO.unobserve(el);el.style.animationDelay=(k++*60)+"ms";el.classList.add("hri");var b=el.matches(".res>div")&&el.querySelector("b");if(b)setTimeout(function(){hcount(b)},k*90)})},{threshold:.12});
  root.querySelectorAll(HSEL).forEach(function(el){if(el.dataset.hr)return;el.dataset.hr=1;el.classList.add("hro");HIO.observe(el)});
}
function hcount(b){
  var s=b.textContent,m=s.match(/^([^0-9]*)(\d[\d.,]*)(.*)$/);if(!m||/[.,]\d{1,2}$/.test(m[2]))return;
  var sep=m[2].match(/[.,]/),to=parseInt(m[2].replace(/[.,]/g,""),10),t0=performance.now();if(!(to>0))return;
  function fmt(v){var x=String(v);return sep?x.replace(/\B(?=(\d{3})+(?!\d))/g,sep[0]):x}
  (function st(t){var p=Math.min(1,(t-t0)/1300),e=1-Math.pow(1-p,3);b.textContent=m[1]+fmt(Math.round(to*e))+m[3];if(p<1)requestAnimationFrame(st)})(t0);
}
